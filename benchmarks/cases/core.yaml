- id: unstructured_refund_policy
  domain: unstructured
  query: "What is the refund window for Acme Tools?"
  expected:
    mode: sufficient
    required_evidence:
      - file: unstructured/refund_policy.md
        kind: section
        contains:
          - "30 days"
          - "order number"
  tags: [smoke, unstructured, policy, exact_fact]

- id: unstructured_revenue_conflict
  domain: unstructured
  query: "What was Q1 revenue?"
  expected:
    mode: disputed
    required_evidence:
      - file: unstructured/finance_q1_report.md
        contains: ["1.2 billion"]
      - file: unstructured/audit_q1_note.md
        contains: ["1.4 billion"]
  tags: [diagnostic, unstructured, governance, conflict]

- id: unstructured_missing_budget
  domain: unstructured
  query: "What is the Project Nebula budget?"
  expected:
    mode: insufficient
    forbidden_evidence:
      - file: unstructured/refund_policy.md
        contains: ["30 days"]
  tags: [diagnostic, unstructured, insufficient, missing_fact]

- id: unstructured_support_sla_gold_response
  domain: unstructured
  query: "What is the Gold support first response time for Severity 1 incidents?"
  expected:
    mode: sufficient
    required_evidence:
      - file: unstructured/support_sla.md
        kind: section
        contains:
          - "Gold support"
          - "15 minutes"
          - "Severity 1"
  tags: [smoke, unstructured, sla, exact_fact]

- id: unstructured_rma_acronym
  domain: unstructured
  query: "What does RMA mean and when do Gold-tier RMA labels expire?"
  expected:
    mode: sufficient
    required_evidence:
      - file: unstructured/support_sla.md
        contains:
          - "Return Material Authorization"
          - "14 days"
  tags: [diagnostic, unstructured, acronym, exact_fact]

- id: unstructured_project_orion_latest_status
  domain: unstructured
  query: "What is the latest EU status for Project Orion?"
  expected:
    mode: sufficient
    required_evidence:
      - file: unstructured/project_orion_status.md
        contains:
          - "2026-05-20"
          - "general availability"
          - "EU"
    forbidden_evidence:
      - file: unstructured/project_orion_status.md
        contains:
          - "2026-01-15"
          - "private beta"
  tags: [diagnostic, unstructured, temporal, freshness]

- id: unstructured_search_outage_final_duration
  domain: unstructured
  query: "What was the final recovery duration for Search outage INC-101?"
  expected:
    mode: sufficient
    required_evidence:
      - file: unstructured/outage_postmortem.md
        contains:
          - "final postmortem"
          - "42 minutes"
          - "INC-101"
    forbidden_evidence:
      - file: unstructured/outage_postmortem.md
        contains:
          - "estimated"
          - "20 minutes"
  tags: [diagnostic, unstructured, temporal, final_fact]

- id: structured_warehouse_stock
  domain: structured
  query: "How many flux capacitor units are in the west region?"
  expected:
    mode: sufficient
    required_evidence:
      - file: structured/warehouses.csv
        kind: table
        contains:
          - "flux capacitor"
          - "17"
          - "west"
  tags: [diagnostic, structured, table, exact_fact]

- id: structured_incident_owner
  domain: structured
  query: "Who owns incident INC-103?"
  expected:
    mode: sufficient
    required_evidence:
      - file: structured/incidents.csv
        kind: table
        contains:
          - "INC-103"
          - "auth"
          - "Mina"
  tags: [smoke, structured, table, exact_fact]

- id: structured_s1_west_incidents
  domain: structured
  query: "Which S1 incidents are in the west region?"
  expected:
    mode: sufficient
    required_evidence:
      - file: structured/incidents.csv
        kind: table
        contains:
          - "INC-101"
          - "west"
      - file: structured/incidents.csv
        kind: table
        contains:
          - "INC-103"
          - "west"
  tags: [diagnostic, structured, table, filtered_lookup]

- id: structured_s1_shortest_resolution
  domain: structured
