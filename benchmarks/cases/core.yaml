- id: structured_token_rotation_rollout
  domain: structured
  query: "Which release enabled token rotation in the EU region?"
  expected:
    mode: sufficient
    required_evidence:
      - file: structured/rollout_matrix.csv
        kind: table
        contains:
          - "token_rotation"
          - "eu"
          - "2026.05"
  tags: [smoke, structured, table, exact_fact]

- id: code_symbol_lookup
  domain: code
  query: "Which Python symbol implements expired session refresh inside the grace window?"
  expected:
    mode: sufficient
    required_evidence:
      - file: code/auth_service.py
        kind: symbol
        location_contains: "refresh_expired_session"
        contains:
          - "refresh_expired_session"
          - "grace"
  tags: [diagnostic, code, symbol_lookup]

- id: code_doc_conflict
  domain: code
  query: "Are expired sessions ever refreshed?"
  expected:
    mode: disputed
    required_evidence:
      - file: code/auth_service.py
        contains: ["refresh_expired_session"]
      - file: code/README.md
        contains: ["expired sessions are never refreshed"]
  tags: [diagnostic, code, stale_docs, conflict]

- id: code_billing_symbol_lookup
  domain: code
  query: "Which Python method implements the volume discount?"
  expected:
    mode: sufficient
    required_evidence:
      - file: code/billing_service.py
        kind: symbol
        location_contains: "apply_volume_discount"
        contains:
          - "quantity >= 100"
          - "0.90"
  tags: [diagnostic, code, symbol_lookup]

- id: code_env_var_lookup
  domain: code
  query: "Which required environment variable stores the API token?"
  expected:
    mode: sufficient
    required_evidence:
      - file: code/config_loader.py
        kind: symbol
        location_contains: "REQUIRED_ENV_VARS"
        contains:
          - "FITZ_API_TOKEN"
          - "FITZ_WORKSPACE"
  tags: [smoke, code, symbol_lookup, exact_fact]

- id: code_billing_doc_conflict
  domain: code
  query: "Do bulk orders receive a discount?"
  expected:
    mode: disputed
    required_evidence:
      - file: code/billing_service.py
        contains:
          - "apply_volume_discount"
          - "quantity >= 100"
      - file: code/billing_notes.md
        contains:
          - "bulk orders never receive discounts"
  tags: [diagnostic, code, stale_docs, conflict]

- id: mixed_release_and_table
  domain: mixed
  query: "Which release mentioned the west-region warehouse audit and how many flux capacitor units did it confirm?"
  expected:
    mode: sufficient
    required_evidence:
      - file: mixed/release_notes.md
        contains:
          - "Release 2026.05"
          - "17"
      - file: structured/warehouses.csv
        contains:
          - "WH-1"
          - "17"
  tags: [diagnostic, mixed, table, unstructured]

- id: mixed_security_rollout_policy_interval
  domain: mixed
  query: "For the EU token rotation rollout, which release enabled it and what policy interval applies?"
  expected:
    mode: sufficient
    required_evidence:
      - file: mixed/security_rollout.md
        contains:
          - "token_rotation"
          - "release 2026.05"
      - file: unstructured/security_policy.md
        contains:
          - "45 days"
          - "Service tokens"
      - file: structured/rollout_matrix.csv
        contains:
          - "token_rotation"
          - "eu"
          - "2026.05"
  tags: [diagnostic, mixed, table, unstructured, multi_hop]

- id: mixed_incident_playbook_to_table
  domain: mixed
  query: "Using the incident playbook, who owned the west-region cache replay fix and how long did INC-101 take to recover?"
  expected:
    mode: sufficient
    required_evidence:
      - file: mixed/incident_playbook.md
        contains:
          - "west-region cache replay fix"
          - "INC-101"
      - file: structured/incidents.csv
        contains:
          - "INC-101"
          - "Nora"
          - "42"
      - file: unstructured/outage_postmortem.md
        contains:
          - "Nora"
          - "42 minutes"
  tags: [diagnostic, mixed, table, unstructured, multi_hop]
