  expected:
    required_evidence:
      - file: ecommerce_schema.sql
        contains: ["customers", "products", "orders", "order_items"]
  tags: [production, format_sql, aggregation]

- id: sql_order_columns
  domain: engineering
  query: "Which columns are defined on the orders table?"
  expected:
    required_evidence:
      - file: ecommerce_schema.sql
        contains: ["order_id", "customer_id", "status", "total_cents"]
  tags: [production, format_sql, direct_lookup]

- id: sql_customer_order_relation
  domain: engineering
  query: "How are customers and orders related in the NovaMart schema?"
  expected:
