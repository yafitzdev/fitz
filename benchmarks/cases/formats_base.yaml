- id: pptx_q3_revenue
  domain: healthcare
  query: "What was Meridian Health's Q3 revenue?"
  expected:
    required_evidence:
      - file: quarterly_review.pptx
        contains: ["847", "million"]
  tags: [production, format_pptx, direct_lookup]

- id: pptx_patient_count
  domain: healthcare
  query: "How many patients did Meridian Health serve in Q3?"
  expected:
    required_evidence:
      - file: quarterly_review.pptx
        contains_any: ["2.4 million", "2,400,000"]
  tags: [production, format_pptx, direct_lookup]

- id: pptx_expansion
