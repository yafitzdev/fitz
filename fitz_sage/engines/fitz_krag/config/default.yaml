# fitz_sage/engines/fitz_krag/config/default.yaml
#
# Default configuration for Fitz KRAG engine.
#
# KRAG = Knowledge Routing Augmented Generation. Documents are parsed
# into typed retrieval units (code symbols, sections, tables); each
# query routes to the right structural search strategy. There are
# no dense embeddings — the LLMReranker provides precision over wide
# BM25 candidate sets.

fitz_krag:

  # Chat models by tier — single chat protocol (OpenAI-compatible HTTP).
  # Provider name 'endpoint' = bring your own URL (set via chat_base_url
  # below). 'openai' / 'azure_openai' / 'enterprise' are presets.
  chat_fast: endpoint/qwen2.5-7b-instruct
  chat_balanced: endpoint/qwen2.5-7b-instruct
  chat_smart: endpoint/qwen2.5-7b-instruct

  # HTTP endpoint for chat (and vision, when vision_base_url is null).
  # Default assumes a local llama-server on port 8080.
  chat_base_url: http://localhost:8080/v1
  vision_base_url: null
  chat_api_key_env: null
  vision_api_key_env: null

  # Vector DB plugin — kept for legacy schema compatibility (vector
  # columns stay NULL in this architecture). Scheduled for removal.
  vector_db: pgvector

  # Reranker. 'llm' = score candidates with the configured chat factory
  # (fast tier). null = disabled.
  rerank: llm

  # Vision (null = disabled). Uses the OpenAI-compatible chat-completions
  # endpoint with image content parts.
  vision: null
  parser: docling

  collection: default

  # Code retrieval
  code_languages: [python, typescript, java, go]
  summary_batch_size: 15
  max_expansion_depth: 1
  include_class_context: true

  # Retrieval weights — used by the BM25 + keyword merge in CodeSearch.
  top_addresses: 50
  top_read: 50
  keyword_weight: 0.4
  semantic_weight: 0.6  # legacy field; ignored
  section_bm25_weight: 0.6
  section_semantic_weight: 0.4  # legacy field; ignored

  # Context assembly
  max_context_tokens: 48000
  include_file_header: true

  # Generation
  enable_citations: true
  strict_grounding: true

  # Vector DB kwargs (PostgreSQL connection mode)
  vector_db_kwargs:
    mode: local

  log_level: INFO
