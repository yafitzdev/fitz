# fitz_sage/engines/fitz_krag/config/default.yaml
#
# Default configuration for Fitz KRAG engine.
#
# KRAG = Knowledge Routing Augmented Generation. Documents are parsed
# into typed retrieval units (code symbols, sections, tables); each
# query routes to the right structural search strategy. There are
# no dense embeddings — an INT8 ONNX cross-encoder reranker
# (gte-reranker-modernbert-base) provides precision over wide BM25
# candidate sets.

fitz_krag:

  # Optional chat models by tier. Query intelligence and answer synthesis stay
  # provider-driven. Standard semantic query terms and optional background
  # enrichment use Fitz's managed Qwen ONNX runtime and are not configurable.
  chat_fast: null
  chat_balanced: null
  chat_smart: null
  query_intelligence: null

  # HTTP endpoint for optional endpoint providers. Managed Qwen ONNX ignores
  # this field.
  chat_base_url: http://127.0.0.1:8080/v1
  vision_base_url: null
  chat_api_key_env: null
  auth: null
  cert_path: null
  vision_api_key_env: null

  # Reranker. 'onnx' = INT8 ONNX cross-encoder (Alibaba-NLP/gte-reranker-
  # modernbert-base by default).
  # 'onnx/<hf-model-id>' accepts a compatible repository containing the
  # expected tokenizer plus onnx/model_int8.onnx.
  rerank: onnx

  # Vision (null = disabled). Uses the OpenAI-compatible chat-completions
  # endpoint with image content parts.
  vision: null

  # Document parser. 'cpu' = server-free, zero-model pypdfium2 PDF parsing
  # on CPU (the default). 'docling' / 'docling_vision' / 'glm_ocr' are
  # heavier opt-in parsers for scanned PDFs, figures, and complex tables.
  parser: cpu

  # Governance. Pyrrho evaluates delivered evidence as SUFFICIENT / DISPUTED /
  # INSUFFICIENT; Fitz-Sage maps that verdict without changing it. The bare
  # value uses the accepted immutable default. Local package directories and
  # remote packages pinned to a full commit are supported alternatives.
  governance: pyrrho

  collection: default

  # Code retrieval
  code_languages: [python, typescript, java, go]
  summary_batch_size: 15
  max_expansion_depth: 1
  include_class_context: true

  # Retrieval weights — used by the keyword+BM25 merge in CodeSearch.
  top_addresses: 50
  top_read: 50
  rerank_candidates: 32
  keyword_weight: 0.4

  # Context assembly
  max_context_tokens: 48000
  include_file_header: true

  # Generation
  synthesizer: null
  max_answer_tokens: 512
  short_answer_tokens: 192
  strict_grounding: true
