# fitz_sage/engines/fitz_krag/config/default.yaml
#
# Default configuration for Fitz KRAG engine.
#
# KRAG = Knowledge Routing Augmented Generation
# Uses knowledge-type-aware strategies instead of uniform chunk retrieval.

fitz_krag:

  # Chat models by tier — single chat protocol (OpenAI-compatible HTTP).
  # Provider name 'endpoint' = bring your own URL (set via *_base_url
  # below). 'openai' / 'azure_openai' / 'enterprise' are presets.
  chat_fast: endpoint/qwen2.5-7b-instruct
  chat_balanced: endpoint/qwen2.5-7b-instruct
  chat_smart: endpoint/qwen2.5-7b-instruct

  # Embedding model
  embedding: endpoint/nomic-embed-text-v1.5

  # HTTP endpoints — defaults assume a local llama-server on port 8080
  # for chat and on port 8081 for embeddings. Cloud users override
  # chat_smart to e.g. 'openai/gpt-4o' and unset chat_base_url.
  chat_base_url: http://localhost:8080/v1
  embedding_base_url: http://localhost:8081/v1
  vision_base_url: null
  chat_api_key_env: null
  embedding_api_key_env: null
  vision_api_key_env: null

  # Vector DB
  vector_db: pgvector

  # Reranker. 'llm' = score candidates with the configured chat
  # factory (fast tier). null = disabled.
  rerank: llm

  # Optional (null = disabled)
  vision: null
  parser: docling

  # Collection
  collection: default

  # Code
  code_languages: [python, typescript, java, go]
  summary_batch_size: 15
  max_expansion_depth: 1
  include_class_context: true

  # Retrieval
  top_addresses: 50
  top_read: 50
  keyword_weight: 0.4
  semantic_weight: 0.6
  fallback_to_chunks: true
  section_bm25_weight: 0.6
  section_semantic_weight: 0.4

  # Context
  max_context_tokens: 48000
  include_file_header: true

  # Generation
  enable_citations: true
  strict_grounding: true

  # Vector DB kwargs
  vector_db_kwargs:
    mode: local

  # Logging
  log_level: INFO
