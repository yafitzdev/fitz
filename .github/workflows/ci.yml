# .github/workflows/ci.yml
#
# Continuous Integration for Fitz
# Runs on every push and pull request to ensure code quality

name: CI

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Lint & Type Check
  # ===========================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          pip install ruff black==24.10.0 isort mypy types-PyYAML

      - name: Check formatting with Black
        run: black --check --diff .

      - name: Check import sorting with isort
        run: isort --check-only --diff .

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check package
        run: mypy fitz_sage

  # ===========================================================================
  # Unit Tests (No External Dependencies)
  # ===========================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal deps for unit tests (skip heavy ML deps like docling/torch).
          pip install pydantic pyyaml httpx typing-extensions typer jinja2 fastapi
          # Lightweight document parser deps from the base install.
          pip install pypdfium2 python-docx python-pptx
          pip install pytest pytest-cov pytest-xdist psutil
          # Scientific computing (semantic matching helpers in unit tests).
          pip install numpy
          # Cert generation in tests/unit/conftest.py.
          pip install cryptography
          # Auth resilience (lightweight, needed for M2M auth).
          pip install tenacity circuitbreaker
          # Managed Qwen lifecycle tests patch Hugging Face downloads.
          pip install huggingface-hub
          # Governance runtime; model dependencies are not needed by mocked unit tests.
          pip install "pyrrho>=0.1.0,<0.2" --no-deps
          # Property testing.
          pip install hypothesis
          # Install package in editable mode without deps (already installed above).
          pip install -e . --no-deps

      - name: Run tests
        env:
          PYTHONUTF8: 1
        run: |
          pytest tests/unit/ -m "not slow" -v --tb=short -n 2

  # ===========================================================================
  # Core Module Import Check (Lightweight)
  # ===========================================================================
  import-check:
    name: Core Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          # Install minimal core dependencies (skip heavy ML deps)
          pip install pydantic pyyaml httpx typing-extensions typer jinja2 fastapi
          # Auth resilience (lightweight, needed for M2M auth)
          pip install tenacity circuitbreaker
          pip install -e . --no-deps

      - name: Check core imports work
        run: |
          # Only check imports that don't require heavy ML dependencies
          python -c "from fitz_sage.core import Answer, Provenance, Query; print('Core imports OK')"
          python -c "import fitz_sage; print('Package imports OK')"

      - name: Check CLI entry point exists
        run: |
          # Just verify the entry point is registered (don't run it as it needs full deps)
          python -c "from importlib.metadata import entry_points; eps = entry_points(); print('Entry points OK')"

  # ===========================================================================
  # Built Wheel Smoke (Packaging Boundary)
  # ===========================================================================
  wheel-smoke:
    name: Built Wheel Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build, install, and import-smoke wheel
        run: python -m tools.wheel_smoke --smoke import

  # ===========================================================================
  # Coverage Report (Optional - on main branch only)
  # ===========================================================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Minimal deps for unit tests (skip heavy ML deps).
          pip install pydantic pyyaml httpx typing-extensions typer jinja2 fastapi
          pip install pypdfium2 python-docx python-pptx
          pip install pytest pytest-cov pytest-xdist psutil
          pip install numpy
          pip install cryptography
          pip install tenacity circuitbreaker
          pip install huggingface-hub
          pip install "pyrrho>=0.1.0,<0.2" --no-deps
          pip install hypothesis
          pip install -e . --no-deps

      - name: Run tests with coverage
        run: |
          pytest tests/unit/ -m "not slow" --cov=fitz_sage --cov-report=xml --cov-report=term-missing --cov-fail-under=70 -n 2

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
